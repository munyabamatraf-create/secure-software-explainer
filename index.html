{t:"Why security matters",l:"row",fx:"tick",i:[["📱","Mobile apps"],["☁️","Cloud computing"],["🏦","Online banking"],["🛒","E-commerce"],["📰","Breach headlines","bad"]],big:"Secure Software = Compliance + Privacy + Security",n:"Every day, software systems store and process sensitive information. A single security failure can result in financial loss, legal penalties, and loss of trust. Developers must understand governance, privacy, and security by design."},
